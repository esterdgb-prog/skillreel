const pulse = (e, a, b, k = 1.08, per = 0.9) => {
  if (e instanceof SVGElement) gsap.set(e, { transformOrigin: "50% 50%" });
  for (let s = a; s < b - per; s += per) tl.fromTo(e, { scale: 1 }, { scale: k, duration: per / 2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, s);
};
/** flutua (sobe e desce devagar) entre a e b */
const float = (e, a, b, amp = 12, per = 2.4) => {
  for (let s = a; s < b - 0.2; s += per) tl.fromTo(e, { y: 0 }, { y: -amp, duration: per / 2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, s);
};
/** objeto HTML voando por uma curva quadrática p0→p1→p2 (gira na direção do voo) */
const fly = (e, p0, p1, p2, t, d, opt = {}) => {
  const P = { u: 0 }, w = opt.w || 64;
  const at = (u) => [(1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0], (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1]];
  const put = (u) => { const [x, y] = at(u), [x2, y2] = at(Math.min(1, u + 0.01)), [x1, y1] = at(Math.max(0, u - 0.01));
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI + (opt.rot || 0);
    e.style.transform = `translate(${(x - w / 2).toFixed(1)}px,${(y - w / 2).toFixed(1)}px) rotate(${ang.toFixed(1)}deg)`; };
  put(0);
  tl.fromTo(P, { u: 0 }, { u: 1, duration: d, ease: opt.ease || "power1.inOut", immediateRender: false, onUpdate() { put(P.u); } }, t);
  K.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
};
/** contador numérico num elemento */
const count = (e, a, b, t, d, fmt = (v) => Math.round(v)) => {
  const P = { v: a }; e.textContent = fmt(a);
  tl.fromTo(P, { v: a }, { v: b, duration: d, ease: "power2.out", immediateRender: false, onUpdate() { e.textContent = fmt(P.v); } }, t);
};

const LABEL = (txt, x, y, opt = {}) => `<div class="${opt.cls || "lb"}" style="position:absolute;left:${x}px;top:${y}px;${opt.center ? "transform:translateX(-50%);" : ""}white-space:nowrap;font:${opt.font || "800 30px/1 var(--fS)"};color:${opt.color || WHITE};letter-spacing:${opt.ls || "0"};${opt.css || ""}">${txt}</div>`;

// ===== modo "enxuto" de efeitos sonoros (vsl.json "sfxModo": "enxuto"; injetado por montar.mjs depois dos beats) =====
// O padrão deste estilo. O kit põe som em toda peça (a referência aprovada tem ~1,4 efeito/s); este filtro aplica a
// regra R2 sem mexer no kit, contando TUDO (a digitação também, como o verificar.py conta):
// 1. mantém os sons das peças grandes (glitch, boom, carimbo, clique, whoosh de troca, ding) e a digitação;
// 2. só deixa um som pequeno (pop, swoosh, tick, shimmer) quando ele cai ≥ 0,6 s depois do último som mantido;
// 3. corta sons pequenos (do fim para o começo, um sim um não, em passadas) até ficar ≤ 0,8 efeito/s;
// 4. se ainda passar, corta whoosh/swoosh e ding (nunca glitch, boom, carimbo, clique nem digitação).
(() => {
  const GRANDE = ["glitch", "boom", "stamp", "click", "whoosh", "ding"], FIXO = ["glitch", "boom", "stamp", "click", "type"];
  const ALVO = 0.8;
  const nome = (a) => a.getAttribute("src").replace(/^.*\/|\.wav$/g, "");
  const all = [...document.querySelectorAll('#vsl audio[src^="assets/sfx/"]')]
    .map((a) => ({ a, n: nome(a), t: +a.dataset.start })).sort((x, y) => x.t - y.t);
  let kept = [];
  let last = -9, lastBig = -9;
  for (const s of all) {
    if (s.n === "type") { kept.push(s); continue; }
    if (GRANDE.includes(s.n)) {
      if (s.t - lastBig < 0.25) { s.a.remove(); continue; }
      kept.push(s); last = lastBig = s.t; continue;
    }
    if (s.t - last >= 0.6) { kept.push(s); last = s.t; } else s.a.remove();
  }
  const dur = CFG.dur || 1, dens = () => kept.length / dur;
  const corta = (filtro) => {
    while (dens() > ALVO) {
      const lista = kept.filter(filtro);
      if (!lista.length) return;
      for (let i = lista.length - 1; i >= 0 && dens() > ALVO; i -= 2) { lista[i].a.remove(); kept = kept.filter((k) => k !== lista[i]); }
    }
  };
  corta((s) => !GRANDE.includes(s.n) && s.n !== "type");   // pequenos
  corta((s) => !FIXO.includes(s.n));                         // whoosh, swoosh, ding
  console.log(`sfx enxuto: ${kept.length} efeitos (${dens().toFixed(2)}/s, digitação incluída)`);
})();
